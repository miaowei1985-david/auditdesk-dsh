name: AuditDesk Windows Build

# 手工触发：在 Windows runner 上构建未签名的 AuditDesk 安装包并上传 artifact。
on:
  workflow_dispatch:
    inputs:
      build_version:
        description: '构建版本（形如 0.2.2-rc.5.20261122.1）'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build unsigned Windows installer
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: >-
          pnpm --filter @deepseek-ai/dsh-desktop run package:win:x64:unsigned --
          --build-version "${{ inputs.build_version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: AuditDesk-Windows-unsigned
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
