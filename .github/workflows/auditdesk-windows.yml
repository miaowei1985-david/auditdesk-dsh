name: AuditDesk Windows Build

# 手动触发，或推送 master 时自动构建未签名的 AuditDesk 安装包。
# 产物同时上传为 Actions artifact 和 GitHub Release 附件（公开可下载）。
on:
  workflow_dispatch:
    inputs:
      build_version:
        description: '构建版本（留空则自动生成）'
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Resolve build version
        shell: pwsh
        run: |
          $version = "${{ inputs.build_version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $date = (Get-Date).ToUniversalTime().AddHours(8).ToString('yyyyMMdd')
            $version = "0.2.2-rc.5.$date.${{ github.run_number }}"
          }
          "DSH_DESKTOP_BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "build version: $version"
      - name: Write packaging env
        shell: pwsh
        run: |
          @'
          DSH_DESKTOP_APP_ID=com.auditdesk.desktop
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://updates.example.invalid
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://login.example.invalid"]}
          '@.Trim() | Out-File -FilePath apps/desktop/.env.windows -Encoding utf8
          Get-Content apps/desktop/.env.windows
      - name: Build unsigned Windows installer
        run: pnpm --filter @deepseek-ai/dsh-desktop run package:win:x64:unsigned
      - name: Smoke install and launch
        continue-on-error: true
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts -Filter *.exe | Select-Object -First 1
          Write-Host "installer: $($installer.FullName)"
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 15
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'AuditDesk.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'AuditDesk.exe not found after silent install' }
          $vi = (Get-Item $exe.FullName).VersionInfo
          Write-Host "installed: $($exe.FullName) product=$($vi.ProductName) fileVersion=$($vi.FileVersion)"
          $env:DSH_HOME = Join-Path $env:TEMP 'auditdesk-smoke-home'
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 30
          $running = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
          if (-not $running) { throw 'AuditDesk process exited during startup' }
          Write-Host "running: pid=$($proc.Id) windowTitle=$($running.MainWindowTitle)"
          $uninstall = Get-ChildItem (Split-Path $exe.FullName) -Filter 'Uninstall AuditDesk.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($uninstall) { Start-Process -FilePath $uninstall.FullName -ArgumentList '/S' -Wait }
      - uses: actions/upload-artifact@v4
        with:
          name: AuditDesk-Windows-unsigned
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: AuditDesk Windows ${{ github.run_number }}
          body: |
            Automated unsigned Windows build of AuditDesk (AuditDesk 定制桌面端).
            Build version: ${{ env.DSH_DESKTOP_BUILD_VERSION }}
            Commit: ${{ github.sha }}
          files: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
