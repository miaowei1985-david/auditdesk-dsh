name: AuditDesk Windows Build

# 手动触发，或推送 master 时自动构建未签名的 AuditDesk 安装包。
# 产物同时上传为 Actions artifact 和 GitHub Release 附件（公开可下载）。
on:
  workflow_dispatch:
    inputs:
      build_version:
        description: '构建版本（留空则自动生成）'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/auditdesk-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Resolve build version
        shell: pwsh
        run: |
          $version = "${{ inputs.build_version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $date = (Get-Date).ToUniversalTime().AddHours(8).ToString('yyyyMMdd')
            $version = "0.2.2-rc.5.$date.${{ github.run_number }}"
          }
          "DSH_DESKTOP_BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "build version: $version"
      - name: Build unsigned Windows installer
        run: pnpm --filter @deepseek-ai/dsh-desktop run package:win:x64:unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: AuditDesk-Windows-unsigned
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: AuditDesk Windows ${{ github.run_number }}
          body: |
            Automated unsigned Windows build of AuditDesk (AuditDesk 定制桌面端).
            Build version: ${{ env.DSH_DESKTOP_BUILD_VERSION }}
            Commit: ${{ github.sha }}
          files: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
