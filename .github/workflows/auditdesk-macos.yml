name: AuditDesk macOS Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/resources/audit-plugins/**'
      - 'apps/desktop/scripts/electron-builder-config.mjs'
      - 'apps/desktop/src/**'
      - 'apps/desktop/resources/**'
      - '.github/workflows/auditdesk-macos.yml'
  workflow_dispatch:

env:
  CI: '1'
  HTTP_PROXY: http://127.0.0.1:7890
  HTTPS_PROXY: http://127.0.0.1:7890
  NODE_USE_ENV_PROXY: '1'
  NO_PROXY: localhost,127.0.0.1,::1
  DSH_DESKTOP_AUTO_UPDATE_ENV: test

permissions:
  contents: write

jobs:
  build:
    name: build
    runs-on: [self-hosted, macOS, ARM64, auditdesk]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned macOS app
        run: pnpm package:mac:arm64:unsigned
        working-directory: apps/desktop

      - name: Verify bundle contents
        run: |
          APP="apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/mac-arm64/AuditDesk.app"
          test -d "$APP"
          test -d "$APP/Contents/Resources/audit-plugins/plugins"
          test -x "$APP/Contents/Resources/runtime/cli/bin/dsh"
          ls "$APP/Contents/Resources/audit-plugins/plugins"
          echo "bundle-ok"

      - name: Install and launch smoke
        run: |
          set -euo pipefail
          DMG=$(ls apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg | head -1)
          echo "dmg: $DMG"
          MOUNT=/tmp/auditdesk-dmg
          rm -rf "$MOUNT"
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -nobrowse -mountpoint "$MOUNT"
          ls "$MOUNT"
          APP="$MOUNT/AuditDesk.app"
          test -d "$APP"
          rm -rf /Applications/AuditDesk.app
          cp -R "$APP" /Applications/AuditDesk.app
          hdiutil detach "$MOUNT" -quiet || true
          xattr -cr /Applications/AuditDesk.app || true
          codesign --force --deep --sign - /Applications/AuditDesk.app || true
          sudo spctl --global-disable || true
          open -a /Applications/AuditDesk.app || true
          sleep 25
          if pgrep -f '/Applications/AuditDesk.app/Contents/MacOS/AuditDesk' >/dev/null; then
            echo "launch: ok"
          else
            echo "launch: failed"
            log show --last 2m --predicate 'process == "AuditDesk"' | tail -50 || true
            exit 1
          fi
          mkdir -p artifacts
          screencapture -x artifacts/macos-desktop.png || true
          PROFILE="$HOME/.dsh/profiles/desktop/package.json"
          echo "profile: $PROFILE"
          cat "$PROFILE" || true
          if ! grep -q 'dsh-audit-workbench' "$PROFILE" 2>/dev/null; then
            echo "audit-plugin-bootstrap: FAILED"
            cat "$HOME/.dsh/audit-plugins-bootstrap.log" 2>/dev/null || true
            ls -la "$HOME/.dsh/plugins/auditdesk" 2>/dev/null || true
            ls -la "/Applications/AuditDesk.app/Contents/Resources/audit-plugins/plugins" || true
            exit 1
          fi
          test -d "$HOME/.dsh/profiles/desktop/node_modules/@local/dsh-audit-kb"
          test -d "$HOME/.dsh/profiles/desktop/node_modules/@local/dsh-audit-workbench"
          echo "audit-plugin-bootstrap: ok"
          cp -R /Applications/AuditDesk.app/Contents/Resources/audit-plugins artifacts/audit-plugins
          pkill -f '/Applications/AuditDesk.app/Contents/MacOS/AuditDesk' || true

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: auditdesk-macos-unsigned-dmg
          path: apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-build-${{ github.run_number }}
          name: AuditDesk macOS ${{ github.run_number }}
          body: |
            AuditDesk macOS unsigned build (arm64).
            DMG is ad-hoc signed for smoke testing; production distribution requires signing/notarization.
          files: apps/desktop/.desktop-build/targets/mac-arm64/unsigned-artifacts/*.dmg
          fail_on_unmatched_files: true

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditdesk-macos-smoke
          path: artifacts
          if-no-files-found: ignore
          retention-days: 7
